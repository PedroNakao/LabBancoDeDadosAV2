<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Aluno</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>Tela de Cadastro</h1>

    <form action="#" th:action="@{/aluno/CadastrarAluno}" th:object="${aluno}" method="post">
        <input type="text" th:field="*{nomeCompleto}" placeholder="Nome do Aluno" class="form-control mb-4 col-4"/>
        <input type="text" th:field="*{email}" placeholder="E-mail" class="form-control mb-4 col-4"/>

        <input type="text" th:field="*{bairro}" placeholder="Bairro" class="form-control mb-4 col-4"/>

        <div class="form-check mb-3">
            <input type="checkbox" th:field="*{receberMensagem}" class="form-check-input mb-4 col-4"/>
        </div>
        <button type="submit" class="btn btn-primary">Cadastrar</button>
    </form>
    <hr/>
    <a th:href="@{/paginaInicial}" class="btn btn-secondary">Voltar</a>
</body>
</html>
