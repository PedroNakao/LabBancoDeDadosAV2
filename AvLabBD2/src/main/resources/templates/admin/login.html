<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark px-4 mb-4">
        <span class="navbar-brand fw-bold">Oráculo Admin</span>
    </nav>

    <div class="container">
        <h2 class="mb-4">Área de Login</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-body">

                <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

                <form th:action="@{/admin/login}" method="post">
                    <input type="hidden" name="destino" th:value="${destino}"/>

                    <div class="mb-3">
                        <label class="form-label">Login</label>
                        <input type="text" name="login" class="form-control" placeholder="Digite seu login" required autofocus/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" placeholder="Digite sua senha" required/>
                    </div>

                    <button type="submit" class="btn btn-dark mt-2">ENTRAR</button>
                </form>

            </div>
        </div>
    </div>
</body>
</html>
