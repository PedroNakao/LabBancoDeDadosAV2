<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Curso</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div>
    <h1> Cadastro de Curso</h1>


    <form action="#" th:action="@{/curso/postCadastroCurso}" th:object="${curso}" method="POST">
        <input type="text" th:field = "*{nome}" placeholder="Nome" class="form-control mb-4 col-4">
        <input type="text" th:field = "*{descricao}" placeholder="Descrição" class="form-control mb-4 col-4">
        <button type="submit" class="btn btn-primary"> Cadastrar Curso</button>
    </form>
    <hr>
    <a th:href = "@{/curso}" class="btn btn-primary">Voltar para Lista de Cursos </a>
</div>
</body>
</html>
